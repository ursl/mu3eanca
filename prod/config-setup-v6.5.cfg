# Setup MU3E release v6.5 under setup_basedir (from host overlay).
#
#   ./relval -c config-setup-v6.5.cfg
#   ./relval -c config-setup-v6.5.cfg -n

target: setup

mu3e_repo: "git@bitbucket.org:mu3e/mu3e"
mu3e_tag: "v6.5"
# Optional: track origin/<branch> HEAD instead of a release tag.
# mu3e_checkout_branch: "dev"
# Optional: merge after checkout (comma-separated or repeated via merges).
# mu3e_merges: "CDB-v6.9pre"
# mu3e_checkout_merge: "CDB-v6.9pre"
# Optional workdir name under setup_basedir (default: mu3e-v6.5).
# mu3e_workdir: "mu3e-v6.5"

# Defaults for id=mu3e: build=true, relink=true, submodules=true
# mu3e_build: true
# mu3e_relink: true
# mu3e_submodules: true

make_jobs: 10
