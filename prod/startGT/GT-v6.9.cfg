# GT-v6.9.cfg
# ===========
#
# One mcideal mu3eSim run -> single alignment ROOT shared by all GTs.
# Installed-component selection: cdbRunPayloadWriter -m (2025 for v6.9).
#
#   ./startGT [-c GT-v6.9.cfg] setup
#   ./startGT [-c GT-v6.9.cfg] sim
#   ./startGT [-c GT-v6.9.cfg] -g mcideal alltags
#   ./startGT [-c GT-v6.9.cfg] -g mcrealistic alltags
#   ./startGT [-c GT-v6.9.cfg] -g data alltags
#
# -g flavour + gt_base below → mcidealv6.9, mcrealisticv6.9=2025V0, datav6.9=2025V0

target: list

mu3e_repo: "git@bitbucket.org:mu3e/mu3e"
mu3e_tag: "v6.9"
mu3e_workdir: "mu3e-v6.9"

make_jobs: 10

test_cdb_dir: "output/test-CDB"

# Global tag version suffix (mcidealv6.9, mcrealisticv6.9=2025V0, …).
gt_base: "v6.9"

# For mcrealistic/data: append ={conditions_year}{conditions_tag} after gt_base.
conditions_year: "2025"
conditions_tag: "V0"

# mcideal mu3eSim -> one alignment ROOT for all GT flavours
sim_conf: "sim_signal.json"
alignment_output: "output/mu3e_alignment.root"

sim_run_id: 1
sim_n_events: 1

# Calibrations written by ./startGT -g FLAVOUR alltags (order preserved; global tag sorted).
alltags: pixelalignment
alltags: fibrealignment
alltags: mppcalignment
alltags: tilealignment
alltags: pixelqualitylm
alltags: fibrequality
alltags: tilequality
alltags: eventstuffv1
alltags: detsetupv1