# GT-v7.1.cfg
# ===========
#
# One mcideal mu3eSim run -> single alignment ROOT shared by all GTs.
# Installed-component selection: cdbRunPayloadWriter -m (2026 for v7.x).
#
#   ./startGT [-c GT-v7.1.cfg] setup
#   ./startGT [-c GT-v7.1.cfg] sim
#   ./startGT [-c GT-v7.1.cfg] -g mcideal alltags
#   ./startGT [-c GT-v7.1.cfg] -g mcrealistic alltags
#   ./startGT [-c GT-v7.1.cfg] -g data alltags
#
# -g flavour + gt_base below → mcidealv7.1, mcrealisticv7.1=2026V0, datav7.1=2026V0

target: list

mu3e_repo: "git@bitbucket.org:mu3e/mu3e"
mu3e_tag: "v7.0pre0"
mu3e_workdir: "mu3e-v7.0pre0"

make_jobs: 10

test_cdb_dir: "output/test-CDB"

# Global tag version suffix (mcidealv7.1, mcrealisticv7.1=2026V0, …).
gt_base: "v7.1"

# For mcrealistic/data: append ={conditions_year}{conditions_tag} after gt_base.
conditions_year: "2026"
conditions_tag: "V0"

# mcideal mu3eSim -> one alignment ROOT for all GT flavours
sim_conf: "sim_signal.json"
alignment_output: "output/mu3e_alignment.root"

sim_run_id: 1
sim_n_events: 1

# Calibrations written by ./startGT -g FLAVOR alltags (order preserved; global tag sorted).
alltags: pixelalignment
alltags: fibrealignment
alltags: mppcalignment
alltags: tilealignment
alltags: pixelqualitylm
alltags: fibrequality
alltags: tilequality
alltags: eventstuffv2
alltags: detsetupv1
