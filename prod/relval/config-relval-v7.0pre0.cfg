# Relval tasks against an existing MU3E setup workdir.
# Host paths: config-<hostname>.cfg (setup_basedir, cdb_dbconn, raw_input_base, …).
#
# Prerequisite: setup the MU3E tree first, e.g.
#   ./relval -c config-setup-v7.0pre0.cfg
# Then
#   ./relval -c config-relval-v7.0pre0.cfg


target: all

# Which MU3E checkout under setup_basedir to run against.
mu3e_workdir: "mu3e-v7.0pre0"
mu3e_tag: "v7.0pre0"

# Reference setup name for compare (directory under setup_basedir).
# Examples: "mu3e-v6.9" or "v6.9" (auto-prefixed with mu3e-).
# Override on CLI:  ./relval -c config-relval.cfg compare compare_against_setup=mu3e-v6.5
compare_against_setup: "mu3e-v6.9"

# Optional overrides for util/validation used by treedump:
# mu3eUtil_workdir: "mu3eUtil-dev"
# mu3eValidation_workdir: "mu3eValidation-master"

make_jobs: 10

# Defaults for sim tasks (overridable per task).
run_id: 1234
n_events: 5000

# Optional prefix for relative raw_input paths on data tasks (set on host config).
raw_input_base: ""
raw_input_layout: "flat"

# Output templates ({task}).
sim_output_tpl: "output/sim-{task}.root"
sort_output_tpl: "output/sort-{task}.root"
trirec_output_tpl: "output/trirec-{task}.root"
fillhist_output_tpl: "output/histograms-{task}.root"

# --- Relval tasks ---
# mode: sim  -> mu3eSim, mu3eSort, mu3eTrirec, fillhist, treedump
# mode: data -> raw_input -> mu3eSort -> mu3eTrirec -> fillhist

[task]
id: signal
mode: sim
sim_conf: sim_signal.json
trirec_conf: trirec.conf
cdb_GT: mcidealv6.5
run_id: 1234
n_events: 5000

[task]
id: conf8
mode: sim
sim_conf: bvr2026/sim_conf8.json
trirec_conf: trirec_twolayer_beam.conf
cdb_GT: mcrealisticv6.5=2025V1
run_id: 1234
n_events: 5000

[task]
id: run06232
mode: data
run_id: 6232
trirec_conf: trirec_twolayer_beam.conf
cdb_GT: datav6.5=2025V1
raw_input: "run06232.mid.lz4"
treedump: false
