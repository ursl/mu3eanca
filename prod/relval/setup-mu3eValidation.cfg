# Setup mu3eValidation under setup_basedir (from host overlay).
#
#   ./relval -c setup-mu3eValidation.cfg

target: setup

mu3eValidation_repo: "git@bitbucket.org:mu3e/mu3eValidation"
mu3eValidation_tag: "master"
# mu3eValidation_checkout_branch: "dev"
# mu3eValidation_merges: "some-feature-branch"
# mu3eValidation_workdir: "mu3eValidation-main"

# Not mu3e → build/relink/submodules default off; enable build if needed:
mu3eValidation_build: true
# mu3eValidation_relink: false
# mu3eValidation_submodules: false

make_jobs: 10
