# prompt-v7.1.cfg
# ===============
#
# Version-0 prompt workflow for 2026 data taking (GT generation v7.1).
# Host paths: host-<platform>.cfg (e.g. host-merlin6.cfg).
#
# Production areas are date-based (rapid cycle), not release-tag names:
#   {setup_basedir}/{prompt_workdir}/{mu3e,minalyzer,mutrig-offline-calibration,...}
#
#   ./prompt [-c prompt-v7.1.cfg] [-H merlin6] list
#   ./prompt [-c prompt-v7.1.cfg] setup
#   ./prompt [-c prompt-v7.1.cfg] init
#   ./prompt [-c prompt-v7.1.cfg] bootstrap    # setup + init
#
# Copy this file (e.g. prompt-260915.cfg), bump prompt_workdir, retarget
# branches/tags, and add [repo] blocks for extra packages.

target: list

# Date-based production area (YYMMDD). Edit for each cycle.
prompt_workdir: "260902"

make_jobs: 10

# GT used when running prompt reconstruction (flavour + gt_base below).
cdb_GT: "datav7.1=2026V0"

# Chunking / skip thresholds (processRuns defaults).
n_events: 100000
min_events: 10000
run_block_max: 10

# Alignment ROOT written at init (processRuns: mu3eSim in mu3e/run).
sim_conf: "sim_beam.json"
sim_run_id: 1
sim_n_events: 1
alignment_output: "mu3e_alignment.root"

# Packed into slurm/{prompt_workdir}.tar.gz for slurm/run jobs.
# Directory names = [repo] workdir values. Add a line when a package
# must be on the batch node (minalyzer is required by slurm-analyzer.csh).
tar_packages: mu3e
tar_packages: minalyzer

# SLURM job/storage families created at init.
slurm_stages: mlzr
slurm_stages: trirec
slurm_stages: sort

# Extra git log dumps into {prompt_workdir}/githashes (beyond each [repo]).
githash_extra: mu3e/modules/mu3eUtil

# Wrappers relative to mu3eanca (host overlay). Same slurm/run as processRuns.
slurm_analyzer_csh: "run2025/scripts/slurm-analyzer.csh"
slurm_sort_csh: "run2025/scripts/slurm-sort.csh"
slurm_trirec_csh: "run2025/scripts/slurm-trirec.csh"

# ----------------------------------------------------------------------
# Software packages under {setup_basedir}/{prompt_workdir}/<workdir>
#
# Add another package: copy a [repo] block, set id / repo / tag-or-branch,
# workdir (directory name in the production area), and build/relink/submodules.
# Optional cmake_args: extra arguments after `cmake ..`.
# Placeholders: {setup_basedir} {path} {workdir} {id} {<repo id>} {<config key>}.
# install: true (default for mu3e) runs `make install` into {path}/install.
# ----------------------------------------------------------------------

[repo]
id: mu3e
repo: "git@bitbucket.org:mu3e/mu3e"
# Rapid cycle: track origin/dev. Pin a tag instead when needed:
# tag: v7.0pre0
checkout_branch: "dev"
workdir: mu3e
build: true
relink: true
submodules: true
install: true
cmake_args: "-DCMAKE_INSTALL_PREFIX={path}/install"

[repo]
id: minalyzer
repo: "git@bitbucket.org:mu3e/minalyzer"
checkout_branch: "dev"
workdir: minalyzer
build: true
relink: false
submodules: true
cmake_args: "-Dmu3e_DIR={mu3e}/install"

[repo]
id: mutrig-offline-calibration
repo: "git@bitbucket.org:mu3e/mutrig-offline-calibration"
checkout_branch: "master"
workdir: mutrig-offline-calibration
build: true
relink: false
submodules: false


[repo]
id: mu3eana
repo: "git@bitbucket.org:mu3e/mu3eana"
checkout_branch: "minalyzer-pdf-nac"
workdir: mu3eana-minalyzer-pdf-nac
build: true
relink: false
submodules: true

