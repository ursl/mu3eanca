# prompt-v7.1.cfg
# ===============
#
# Version-0 prompt workflow for 2026 data taking (GT generation v7.1).
# Defaults: prompt-base.cfg. Host paths: host-<platform>.cfg.
#
# Production areas are date-based (rapid cycle), not release-tag names:
#   {setup_basedir}/{prompt_workdir}/{mu3e,minalyzer,...}
#
#   ./prompt [-c prompt-v7.1.cfg] [-H merlin6] list
#   ./prompt setup
#   ./prompt [-p minalyzer] setup
#   ./prompt init
#   ./prompt bootstrap
#   ./prompt [-P beam] run 12345
#
# Copy this file (e.g. prompt-260915.cfg), bump prompt_workdir, retarget
# branches/tags, and add [repo] blocks for extra packages.

base: prompt-base.cfg

# Relative to setup_basedir in host-<platform>.cfg
prompt_workdir: "260902"

# GT used when running prompt reconstruction.
cdb_GT: "datav7.1=2026V0"

# ----------------------------------------------------------------------
# Software packages under {setup_basedir}/{prompt_workdir}/<workdir>
#
# Placeholders in cmake_args: {setup_basedir} {path} {workdir} {id}
# {<repo id>} {<config key>}. install: true runs `make install`.
# ----------------------------------------------------------------------

[repo]
id: mu3e
repo: "git@bitbucket.org:mu3e/mu3e"
# Rapid cycle: track origin/dev. Pin a tag instead when needed:
# tag: v7.0pre0
checkout_branch: "dev"
workdir: mu3e
build: true
relink: true
submodules: true
install: true
cmake_args: "-DCMAKE_INSTALL_PREFIX={path}/install"

[repo]
id: minalyzer
repo: "git@bitbucket.org:mu3e/minalyzer"
checkout_branch: "dev"
workdir: minalyzer
build: true
relink: false
submodules: true
cmake_args: "-Dmu3e_DIR={mu3e}/install/{cmake_libdir}/cmake/mu3e"

[repo]
id: mutrig-offline-calibration
repo: "git@bitbucket.org:mu3e/mutrig-offline-calibration"
checkout_branch: "master"
workdir: mutrig-offline-calibration
build: true
relink: false
submodules: false

[repo]
id: mu3eana
repo: "git@bitbucket.org:mu3e/mu3eana"
checkout_branch: "minalyzer-pdf-nac"
workdir: mu3eana-minalyzer-pdf-nac
build: true
relink: false
submodules: t>rue

