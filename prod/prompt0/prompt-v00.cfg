# prompt-v00.cfg
# ==============
#
# Defaults: prompt-base.cfg. Host paths: host-<platform>.cfg.
#
# Production areas are date-based (rapid cycle), not release-tag names:
#   {setup_basedir}/{prompt_workdir}/{mu3e,minalyzer,...}
#
#   ./prompt [-c prompt-v00.cfg] [-H merlin6] list
#   ./prompt setup
#   ./prompt [-p minalyzer] setup
#   ./prompt init
#   ./prompt bootstrap
#   ./prompt [-P beam] run 12345
#
# Copy this file (e.g. prompt-260915.cfg), bump prompt_workdir, retarget
# branches/tags, and add [repo] blocks for extra packages.

base: prompt-base.cfg

# Relative to setup_basedir in host-<platform>.cfg
prompt_workdir: "v00"

# GT used when running prompt reconstruction.
cdb_GT: "datav7.1=2026V0"

cdb_payload_dir: "payloads"

# Minalyzer_pdf is built in dqm_pdf/summary_pdf/_build. cwd is that
# directory so --output-dir output and --csv-dir csv land next to _build.
minalyzer_pdf_bin: "_build/Minalyzer_pdf"
minalyzer_pdf_rundir: "{dqm_pdf}/summary_pdf"

# ----------------------------------------------------------------------
# Software packages under {setup_basedir}/{prompt_workdir}/<workdir>
#
# workdir is the clone directory. build_subdir (optional) is a path inside
# that clone to enter before `mkdir _build && cmake ..`.
# Placeholders in cmake_args: {setup_basedir} {path} {workdir} {id}
# {<repo id>} {<config key>}. install: true runs `make install`.
# patch: path relative to this file; git apply after checkout.
# Repeat patch: for more than one diff. Skip a patch that is already applied.
# symlink: NAME=TARGET inside the clone. TARGET is stored as written
# (use ../other for a sibling checkout).
# ----------------------------------------------------------------------

[repo]  
id: mu3e
repo: "git@bitbucket.org:mu3e/mu3e"
# Rapid cycle: track origin/dev. Pin a tag instead when needed:
#tag: v7.0
#checkout_branch: "dev"
commit: b3ac30d61daae19cd5dc6abff54c3ef2df060d18
workdir: mu3e
build: true
relink: true
submodules: true
install: true
cmake_args: "-DCMAKE_INSTALL_PREFIX={path}/install"
# Turns MU3E_GTTF off when this pin still defaults it to ON.
patch: patches/v00-mu3e-gttf-off.patch

[repo]
id: minalyzer
repo: "git@bitbucket.org:mu3e/minalyzer"
#checkout_branch: "dev"
commit: 00681076298b47cbf2d832787e3bc07fa43e2ca3
workdir: minalyzer
build: true
relink: false
submodules: true
cmake_args: "-Dmu3e_DIR={mu3e}/install/{cmake_libdir}/cmake/mu3e"

[repo]
id: dqm_pdf
repo: "git@bitbucket.org:mu3e/dqm_pdf"
#checkout_branch: "main"
commit: 004774dd875f7b89f57ddcecff58cb60319ea354
workdir: dqm_pdf
build_subdir: summary_pdf
build: true
relink: false
submodules: true


[repo]
id: util
repo: "git@github.com:ursl/util"
checkout_branch: "master"
workdir: util
build: true
relink: false
submodules: false

[repo]
id: mu3eanca
repo: "git@github.com:ursl/mu3eanca"
checkout_branch: "master"
workdir: mu3eanca
build: true
relink: false
submodules: false
# run2026/Makefile's ../util is this clone's util/, i.e. the sibling checkout.
symlink: util=../util


