# merlin6 host overlay for prompt0.
# =================================
#
# Platform file (not a hostname). Loaded when the prompt driver maps
# merlin-l-001 / merlin-l-002 / merlin6 → merlin6, or with -H merlin6.
#
# Paths only. Software versions and extra packages live in prompt-v7.1.cfg
# (and later date-copied versions of that file).

# Parent of dated production areas: {setup_basedir}/{prompt_workdir}/{mu3e,minalyzer,...}
setup_basedir: "/data/experiment/mu3e/data/prod/prompt"

# GNUInstallDirs: mu3eConfig.cmake lives under install/lib64/cmake on merlin6.
cmake_libdir: lib64

relink_script: "/psi/home/langenegger/mu3e/mu3eanca/perl/relinkBinFiles"
mu3eanca: "/psi/home/langenegger/mu3e/mu3eanca"
slurm_run: "/psi/home/langenegger/mu3e/mu3eanca/slurm/run"

cdb_dbconn: "http://mu3edb0/cdb/"
CDB_code_basedir: "/psi/home/langenegger/mu3e/mu3eanca/db0/cdb2"
rdb_url: "http://mu3edb0/rdb"

# Data taking year is per run (run_year: in the version cfg). {year} expands
# to 2025 for run <= 9410 and 2026 from 9411 (so far).
data_dir: "/data/experiment/mu3e/data/{year}"
raw_input_base: "/data/experiment/mu3e/data/{year}/raw"
raw_input_layout: "runblock3"

# slurm_queue: "-p hourly"
slurm_queue: "-p mu3e"
# slurm_queue: "-p 'mu3e --reservation=mu3e'"
