# prompt-v07.cfg
# ==============
#
# same as v06, with calEventStuffV3 and anaComba.
# Lots of changes to minalyzer and dqm_pdf
#
# Defaults: prompt-base.cfg. Host paths: host-<platform>.cfg.
#
# Production areas are date-based (rapid cycle), not release-tag names:
#   {setup_basedir}/{prompt_workdir}/{mu3e,minalyzer,...}
#
#   ./prompt [-c prompt-v02.cfg] [-H merlin6] list
#   ./prompt setup
#   ./prompt [-p minalyzer] setup
#   ./prompt init
#   ./prompt bootstrap
#   ./prompt [-P beam] run 12345
#
# Copy this file (e.g. prompt-260915.cfg), bump prompt_workdir, retarget
# branches/tags, and add [repo] blocks for extra packages.

base: prompt-base.cfg

# -- add cdb_eventstuffv2 while not yet completely switched to v07
#pipeline_alias: dqm=dqm0,cdb_eventstuffv3,dqm1,dqm2

# Relative to setup_basedir in host-<platform>.cfg
prompt_workdir: "v07"

# CDB information used when running prompt reconstruction.
cdb_GT: "datav7.1=2026V1"
cdb_pixelqualitylm_tag: "datav7.1=2026V1"
cdb_eventstuffv2_tag: "datav7.1=2026V0"
cdb_eventstuffv3_tag: "datav7.1=2026V0"

# -- unchanged compared to v03
cdb_pixelqualitylm_comment: "prompt v07"
cdb_eventstuffv2_comment: "prompt v07"
cdb_eventstuffv3_comment: "prompt v07"

cdb_payload_dir: "{cdb_json}/payloads"

# Minalyzer_pdf is built in dqm_pdf/summary_pdf/_build. cwd is that
# directory so --output-dir output and --csv-dir csv land next to _build.
minalyzer_pdf_bin: "_build/Minalyzer_pdf"
minalyzer_pdf_rundir: "{dqm_pdf}/summary_pdf"

# -- minalyzer prescale
minalyzer_prescale: 0.2

#mu3eUtil_checkout_merge: fded309d753d87255fc71337441d592e548016eb

# ---------------------------------------------------------------------
[repo]  
id: mu3e
repo: "git@ssh.bitbucket.org:mu3e/mu3e"
# Rapid cycle: track origin/dev. Pin a tag instead when needed:
#tag: v7.0
#checkout_branch: "dev"
commit: bb2f9e932350bf4ce63b97f89e5fa6df051f92e2
workdir: mu3e
build: true
relink: true
submodules: true
install: true
cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={path}/install"
# Turns MU3E_GTTF off when this pin still defaults it to ON.
#patch: patches/v00-mu3e-gttf-off.patch

[repo]
id: minalyzer
repo: "git@ssh.bitbucket.org:mu3e/minalyzer"
#checkout_branch: "dev"
commit: 796becd7603371aee0272b622287b6a1187fef30
workdir: minalyzer
build: true
relink: false
submodules: true
cmake_args: "-DCMAKE_BUILD_TYPE=Release -Dmu3e_DIR={mu3e}/install/{cmake_libdir}/cmake/mu3e"
#patch: patches/v05-minalyzer-eventID1.patch

[repo]
id: dqm_pdf
repo: "git@ssh.bitbucket.org:mu3e/dqm_pdf"
#checkout_branch: "main"
commit: 438e17b26768aaf9260a80da4b726ae7f437899b
workdir: dqm_pdf
build_subdir: summary_pdf
build: true
relink: false
submodules: true


[repo]
id: util
repo: "git@github.com:ursl/util"
checkout_branch: "master"
workdir: util
build: true
cmake: false
make_jobs: 20
relink: false
submodules: false

[repo]
id: mu3eanca
repo: "git@github.com:ursl/mu3eanca"
checkout_branch: "master"
workdir: mu3eanca
build: true
cmake: false
make_jobs: 20
make_subdir: db0/cdb2
make_subdir: run2026
relink: false
submodules: false
# run2026/Makefile's ../util is this clone's util/, i.e. the sibling checkout.
symlink: util=../util


[repo]
id: mu3eana
repo: "git@ssh.bitbucket.org:mu3e/mu3eana"
#checkout_branch: "cor26"
commit: d5513ed1582d430ef19c89205a8cb06a846a4f74
workdir: mu3eana
build: true
relink: false
submodules: true
cmake_args: "-DCMAKE_BUILD_TYPE=Release "

# env-merlin then install.sh, both sourced by bash. install.sh is the
# build (it uses return, so it is not executed as a program). The 2026
# ana script stays in the task.
[repo]
id: anacomba
repo: "git@ssh.bitbucket.org:mu3e/anacomba"
tag: "v2.3"
workdir: anacomba
build: true
relink: false
submodules: true
build_source: env-merlin
build_source: install.sh
patch: patches/v07-anacomba.patch
