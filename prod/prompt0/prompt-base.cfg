# prompt-base.cfg
# ===============
#
# Shared defaults for prompt-v*.cfg / prompt-YYMMDD.cfg.
# Version files:  base: prompt-base.cfg
# Host paths stay in host-<platform>.cfg (overlay wins).

target: list

make_jobs: 10

# GNUInstallDirs default; host-merlin6.cfg sets lib64.
cmake_libdir: lib

# DQM pipelines:
pipeline_alias: dqm0=midasmeta,cdb_eventstuffv2,minalyzer,rdb_getRunRecord,fillQualityPixels,minalyzer_pdf
pipeline_alias: dqm1=cdb_eventstuffv3,fillDataInformation,cdb_pixelqualitylm,cdb_dataquality
pipeline_alias: dqm2=mu3esort,mu3ecor26
pipeline_alias: dqm3=mu3etrirec,anacomba

pipeline_alias: dqm=dqm0,dqm1,dqm2

fill_quality_pixels_bin: "bin/fillQualityPixels"
fill_quality_pixels_rundir: "{mu3eanca}/run2026"

# anaSortFile: at most this many bins. Output is run2026/anasort/.
anasortframes_nbins: 400

# Minalyzer_pdf: run from the package checkout (config, TeX, output dirs),
# not from _build. Bin is relative to rundir unless absolute.
minalyzer_pdf_bin: "_build/UCL/Minalyzer_pdf/Minalyzer_pdf"
minalyzer_pdf_rundir: "{mu3eana}"
minalyzer_pdf_mode: pdf

# Inclusive last run of each completed year; a bare YYYY is the open year.
# Host paths use {year} (data_dir / raw_input_base).
run_year: 9410=2025
run_year: 2026

# Minalyzer splits a run into jobs of this many events:
# int(N / minalyzer_n_events) + 1 submissions.
# minalyzer_prescale is the fraction analyzed at the start of each chunk
# (1 = the whole chunk; 0.1 of 2000 analyzes the first 200).
minalyzer_n_events: 10000
minalyzer_prescale: 1
min_events: 100

# anaComba on the mu3esort output. anacomba_n_events <= 0 is one job
# (-n 0, every event). A positive value is the chunk size:
# int(N / anacomba_n_events) + 1 jobs, -s skip -n chunk, and the last
# job -n 0 from its skip to the end of the file.
anacomba_n_events: 0
anacomba_hits: 4
anacomba_detector: 39
anacomba_run_class: Beam
anacomba_yaml: anaComba_2026.yaml

# process RUN: after the current raw files, wait this many seconds and look again.
process_sleep: 60

# Files touched in the last two minutes are taken only if fuser shows them
# closed and their size and mtime stay put across this many seconds.
# 0 accepts every file that is already there. Same test as perl/updateDataFromLazy.
raw_settle: 2

# poolN/prodN count a child only until this task. It and every task after
# it keep running, but they do not hold one of the N slots.
pool_long_from: mu3esort

# Alignment ROOT written at init (processRuns: mu3eSim in mu3e/run).
sim_conf: "sim_beam.json"
sim_run_id: 1
sim_n_events: 1
alignment_output: "mu3e_alignment.root"

# Packed into slurm/{prompt_workdir}.tar.gz for slurm/run jobs.
tar_packages: mu3e
tar_packages: minalyzer
tar_packages: anacomba

slurm_stages: mlzr
slurm_stages: trirec
slurm_stages: sort
slurm_stages: cor26
slurm_stages: mmeta
slurm_stages: anacomba

githash_extra: mu3e/modules/mu3eUtil

# mu3eSort / mu3eTrirec alignment + conf (passed as ANLZR to the wrappers).
sort_anlzr: "--alignment.file=mu3e_alignment.root --conf trirec_threelayer_beam.conf "
trirec_anlzr: "--conf trirec_threelayer_beam.conf"
# mu3eTrirec on the mu3esort output. trirec_n_events <= 0 is one job
# (-n 0, every frame). A positive value is the chunk size:
# int(N / trirec_n_events) + 1 jobs, -s skip -n chunk, and the last
# job -n 0 from its skip to the end of the file.
trirec_n_events: 2000000

# Wrappers relative to prod/prompt0 (this directory).
slurm_analyzer_csh: "slurm/slurm-minalyzer.csh"
slurm_sort_csh: "slurm/slurm-mu3esort.csh"
slurm_trirec_csh: "slurm/slurm-mu3etrirec.csh"
slurm_cor26_csh: "slurm/slurm-mu3ecor26.csh"
slurm_midasmeta_csh: "slurm/slurm-midasmeta.csh"
slurm_anacomba_csh: "slurm/slurm-anacomba.csh"
