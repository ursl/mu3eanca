# prompt-base.cfg
# ===============
#
# Shared defaults for prompt-v*.cfg / prompt-YYMMDD.cfg.
# Version files:  base: prompt-base.cfg
# Host paths stay in host-<platform>.cfg (overlay wins).

target: list

make_jobs: 10

# GNUInstallDirs default; host-merlin6.cfg sets lib64.
cmake_libdir: lib

# Per-run pipeline. ./prompt [-P NAME|t1,t2,...] run RUN
# A task that exits non-zero stops the rest of the pipeline for that run.
pipeline: beam
pipeline_alias: beam=midasmeta,skipSmallRuns,minalyzer,minalyzer_pdf,mu3esort,mu3etrirec
pipeline_alias: test=midasmeta

# Minalyzer_pdf: run from the package checkout (config, TeX, output dirs),
# not from _build. Bin is relative to rundir unless absolute.
minalyzer_pdf_bin: "_build/UCL/Minalyzer_pdf/Minalyzer_pdf"
minalyzer_pdf_rundir: "{mu3eana}"
minalyzer_pdf_mode: pdf

# Inclusive last run of each completed year; a bare YYYY is the open year.
# Host paths use {year} (data_dir / raw_input_base).
run_year: 9410=2025
run_year: 2026

# Chunking / skip thresholds (processRuns defaults).
n_events: 1000
min_events: 100
run_block_max: 10

# Alignment ROOT written at init (processRuns: mu3eSim in mu3e/run).
sim_conf: "sim_beam.json"
sim_run_id: 1
sim_n_events: 1
alignment_output: "mu3e_alignment.root"

# Packed into slurm/{prompt_workdir}.tar.gz for slurm/run jobs.
tar_packages: mu3e
tar_packages: minalyzer

slurm_stages: mlzr
slurm_stages: trirec
slurm_stages: sort

githash_extra: mu3e/modules/mu3eUtil

# mu3eSort alignment + conf (passed as ANLZR to slurm-mu3esort.csh).
sort_anlzr: "--alignment.file=mu3e_alignment.root --conf trirec_twolayer_beam.conf"

# Wrappers relative to prod/prompt0 (this directory).
slurm_analyzer_csh: "slurm/slurm-minalyzer.csh"
slurm_sort_csh: "slurm/slurm-mu3esort.csh"
slurm_trirec_csh: "slurm/slurm-mu3etrirec.csh"
